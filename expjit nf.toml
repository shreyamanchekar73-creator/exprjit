[package]
name = "exprjit"
version = "0.1.0"
edition = "2021"
description = "ExprJIT - A Just-In-Time Compiler for a Query Expression Language"

[[bin]]
name = "exprjit"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arrow = "57.0"
cranelift = "0.124"
cranelift-jit = "0.124"
cranelift-module = "0.124"
cranelift-native = "0.124"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "query_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
