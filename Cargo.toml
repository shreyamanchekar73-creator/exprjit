[package]
name = "exprjit"
version = "0.1.0"
edition = "2021"
description = "ExprJIT - A Just-In-Time Compiler for a Query Expression Language"

[[bin]]
name = "exprjit"
path = "src/main.rs"

[dependencies]
tower-http = { version = "0.6", features = ["cors"] }
anyhow = "1"
arrow = "57.0"
axum = "0.8.9"
cranelift = "0.124"
cranelift-jit = "0.124"
cranelift-module = "0.124"
cranelift-native = "0.124"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "query_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
